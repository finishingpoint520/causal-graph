* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }

.header { height: 56px; background: linear-gradient(135deg, #1a237e 0%, #283593 100%); color: white; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.header h1 { font-size: 18px; font-weight: 600; }
.header .stats { font-size: 12px; opacity: 0.85; }
.main { display: flex; height: calc(100vh - 56px); width: 100%; }
.toolbar { width: 280px; min-width: 280px; background: white; border-right: 1px solid #e0e0e0; padding: 14px; overflow-y: auto; }
.toolbar-section { background: #fafafa; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
.toolbar-section h3 { font-size: 13px; color: #333; margin-bottom: 6px; border-bottom: 2px solid #e8eaf6; padding-bottom: 4px; }
.toolbar-section p { font-size: 12px; color: #666; margin-bottom: 4px; }
.toolbar-section select, .toolbar-section input { width: 100%; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; margin: 3px 0; font-family: inherit; }
.toolbar-section button { padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px; background: white; cursor: pointer; font-size: 12px; margin: 2px; font-family: inherit; transition: all 0.15s; }
.toolbar-section button:hover { background: #e8eaf6; border-color: #7986cb; }
.toolbar-section button.active { background: #283593; color: white; border-color: #283593; }
.graph-area { flex: 1; height: 100%; position: relative; background: #fafbfc; }
#network { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #fafbfc; }
.detail { width: 240px; min-width: 240px; background: #f8f9fa; border-left: 1px solid #e0e0e0; padding: 14px; overflow-y: auto; }
.detail h3 { font-size: 13px; color: #1a237e; margin-bottom: 8px; }
.legend { font-size: 12px; line-height: 2; }
.legend .row { display: flex; align-items: center; gap: 6px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.legend .line { display: inline-block; height: 3px; border-radius: 2px; }
.legend .dash-line { display: inline-block; width: 24px; height: 0; border-top: 2px dashed #ccc; }
.empty { color: #999; text-align: center; padding: 20px; font-size: 12px; }
.persona-card { background: white; border-radius: 6px; padding: 8px; margin-top: 6px; font-size: 11px; border: 1px solid #e0e0e0; }
.factor-card { background: white; border-radius: 6px; padding: 10px; margin-bottom: 8px; border: 1px solid #e0e0e0; }
.factor-card h4 { font-size: 14px; margin-bottom: 6px; }
.factor-meta { font-size: 11px; color: #666; margin-bottom: 2px; }
.edge-item { font-size: 11px; background: #f5f5f5; padding: 4px; margin-top: 3px; border-radius: 4px; }
.edge-item a { color: #1a237e; }
@media (max-width: 900px) { .toolbar { width: 220px; min-width: 220px; } .detail { width: 200px; min-width: 200px; } }
@media (max-width: 600px) { .main { flex-direction: column; } .toolbar, .detail { width: 100%; min-width: auto; max-height: 200px; } .graph-area { height: calc(100vh - 56px - 400px); min-height: 300px; } }

"国际油价上涨推动原材料购进价格显著提升，3月PPI同比转正及平减指数重回1%以上已基本确认", "date": "2026-04-03"}, {"speaker": "王本浩", "text": "通胀预期与输入性压力构成当前债市核心变量", "date": "2026-04-03"}, {"speaker": "王本浩", "text": "当前债市关键变量在于通胀，伊朗局势虽带来资金面不确定性，但输入性通胀压力难免", "date": "2026-04-03"}, {"speaker": "王本浩", "text": "CPI方面，经济日报发文严厉指控外卖补贴与通缩的关联性，测算显示去年外卖竞争对CPI月度拖累约0.24-0.27个百分点，近期观察外卖补贴已有所减少，若政策有效落地或助推后续通胀上行", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "3月季节性回升和油价上行抬升通胀预期，战争若延续还会放大外部不确定性", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "油价因素在发改委限价框架下已消化大半，但向材料成本的传导尚需时间，航运价格已部分反映油价影响", "date": "2026-04-03"}, {"speaker": "李博良", "text": "中期关注霍尔木兹海峡通航及油价走势，即便冲突缓和亦不意味油价快速回落，通胀预期仍存", "date": "2026-04-03"}, {"speaker": "张迪", "text": "虽物价等因素仍存偏利空影响，但更多作为交易层面考量", "date": "2026-04-10"}, {"speaker": "李博良", "text": "中期温和通胀有助于经济底部抬升，存在短期逻辑与中期逻辑的分化", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "油价仍是输入性扰动，但若不再极端上冲，对长端的压制有限", "date": "2026-04-10"}, {"speaker": "张晶", "text": "通胀预期和宏观主线的不确定性也值得关注", "date": "2025-06-13"}, {"speaker": "沈文思", "text": "基本面疲弱不支持政策转向，利率上行有上限（1.85%）。央行呵护明确9-10月是买债窗口。短端更确定曲线陡峭化。", "date": "2025-09-12"}], "PL_002→PL_010": [{"speaker": "张晶", "text": "政策端与流动性评估均给予相对中性的3分判断", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "5年以内的资产并未再交易所谓的适度宽松货币政策，国债曲线短端价格已经高于去年12月初水平", "date": "2025-03-10"}, {"speaker": "张晶", "text": "预计3月和4月的经济数据有望环比走高，PMI数据可能维持在51左右", "date": "2025-03-28"}, {"speaker": "杨义山", "text": "明确的是经济下行压力加大，但内需一季度景气环比回升的持续性及抢出口行为的效果尚不明确", "date": "2025-04-11"}, {"speaker": "杨义山", "text": "二季度政策重点在于稳经济，并通过财税和货币政策组合提升企业和居民收入", "date": "2025-04-18"}, {"speaker": "张晶", "text": "对于债券市场而言，宽货币预期仍然是关键", "date": "2025-04-25"}, {"speaker": "刘曼沁", "text": "银行下调存款利率有望打开空间，财政政策配合是关键", "date": "2025-04-25"}, {"speaker": "张晶", "text": "政策空间有限，汇率和利率作为重要工具应审慎使用", "date": "2025-05-05"}, {"speaker": "杨义山", "text": "对五年以内的国债类资产持相对乐观态度，主要受央行恢复国债购买预期的推动", "date": "2025-05-19"}, {"speaker": "张晶", "text": "主要驱动因素包括关税冲击的缓和以及新一轮货币政策边际宽松", "date": "2025-05-23"}, {"speaker": "刘曼沁", "text": "银行下调存款利率有望打开空间，财政政策配合是关键 市延续性仍有保障", "date": "2026-04-17"}, {"speaker": "徐天彤", "text": "潘行长继续强调适度宽松货币政策，金融时报再次说明计量投放并非流动性收紧信号", "date": "2026-04-17"}, {"speaker": "王俊华", "text": "社融层面居民贷款仍处于地板附近，这些内需弱势因素能够支撑债券投资者相信央行会从短端持续呵护利率市场", "date": "2026-04-17"}, {"speaker": "姜之媛", "text": "央行定调稳住短端后胜率大幅提升；叠加利差压缩和非银机构久期回补逻辑，加之30-10及10-1利差厚度提供了赔率", "date": "2026-04-17"}, {"speaker": "柴颖颖", "text": "未来市场的关注点主要集中在央行的态度和政策动向上", "date": "2025-03-14"}, {"speaker": "杨义山", "text": "央行的态度是影响这一动态的核心因素之一，最近通过连续三天的大额净投放来稳定市场情绪", "date": "2025-03-21"}, {"speaker": "李博良", "text": "央行态度的边际恢复并不意味着长端利率会显著下行，反而可能会限制利率的下限", "date": "2025-03-21"}, {"speaker": "赵骥", "text": "2015年是一个分水岭。此前以基本面为主导，而2015年后货币政策前置特征明显", "date": "2025-05-05"}, {"speaker": "杨义山", "text": "对五年以内的国债类资产持相对乐观态度", "date": "2025-06-06"}, {"speaker": "柴颖颖", "text": "债市对基本面反应正在钝化，核心矛盾转向央行操作。央行不愿因股市走强导致债市大跌，但若无央行助力10Y难破1.6%。今年行情呈断点化特征，三季度相对友好但四季度争议增大。票息阶段性占优但性价比下降。", "date": "2025-07-18"}, {"speaker": "杨义山", "text": "10Y国债中枢约1.70%，交易下限从1.62%抬升至1.65%-1.70%。基本面环比下行但斜率平缓，政策对冲温和。央行配合发债意图明确。8月区间1.60%-1.80%，需关注反内卷落实、基本面环比幅度、与股市共振三因素。", "date": "2025-08-08"}, {"speaker": "杨义山", "text": "央行买债+偏空退坡→震荡偏多。10-30利差有收敛空间。短端温和宽松。", "date": "2025-10-30"}, {"speaker": "武玥", "text": "买债影响已定价，最大意义封堵利率上限扭转悲观情绪。向下指向需观察操作细节。逆向策略。", "date": "2025-10-30"}], "PL_001→PL_002": [{"speaker": "张晶", "text": "对\"稳增长与防风险\"权衡有无变化，是否释放偏宽松信号还是转向\"经济向好、政策观望\"", "date": "2026-04-17"}, {"speaker": "姜之媛", "text": "如果二季度的目标转向稳经济，则可能对债券市场形成利好或至少是保持一个较为友好的状态", "date": "2025-03-14"}, {"speaker": "杨义山", "text": "二季度中美两国货币政策可能会有一些共振的空间", "date": "2025-03-21"}, {"speaker": "姜之媛", "text": "当前货币政策呈现出一种与市场和经济实体间的僵持状态", "date": "2025-03-28"}, {"speaker": "姜之媛", "text": "短期内利率仍将保持小幅震荡状态", "date": "2025-04-25"}, {"speaker": "赵骥", "text": "5月初时投资策略的摆布比市场观点本身更加关键", "date": "2025-05-09"}, {"speaker": "姜之媛", "text": "短期内利率仍将保持小幅震荡状态", "date": "2025-05-23"}, {"speaker": "杨义山", "text": "五因子分析：公募新规是比美联储更直接的冲击，留有沟通空间。基本面和政策面均中性。关注季末机构行为和央行微操作。", "date": "2025-09-12"}, {"speaker": "杨义山", "text": "四季度货币政策积极但时点晚，10月会议是关键。货币更多配合财政，物价低迷与政策目标平衡是关注重点。", "date": "2025-09-25"}, {"speaker": "杨义山", "text": "基于对政策窗口期财政与货币政策协同的预期，我对12月债市持震荡偏多观点，认为利率在1.85%-1.90%区间具备配置价值。", "date": "2025-11-27"}], "PL_001→PL_010": [{"speaker": "张晶", "text": "政策端与流动性评估均给予相对中性的3分判断", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "5年以内的资产并未再交易所谓的适度宽松货币政策，国债曲线短端价格已经高于去年12月初水平", "date": "2025-03-10"}, {"speaker": "张晶", "text": "预计3月和4月的经济数据有望环比走高，PMI数据可能维持在51左右", "date": "2025-03-28"}, {"speaker": "杨义山", "text": "明确的是经济下行压力加大，但内需一季度景气环比回升的持续性及抢出口行为的效果尚不明确", "date": "2025-04-11"}, {"speaker": "杨义山", "text": "二季度政策重点在于稳经济，并通过财税和货币政策组合提升企业和居民收入", "date": "2025-04-18"}, {"speaker": "张晶", "text": "对于债券市场而言，宽货币预期仍然是关键", "date": "2025-04-25"}, {"speaker": "刘曼沁", "text": "银行下调存款利率有望打开空间，财政政策配合是关键", "date": "2025-04-25"}, {"speaker": "张晶", "text": "政策空间有限，汇率和利率作为重要工具应审慎使用", "date": "2025-05-05"}, {"speaker": "杨义山", "text": "对五年以内的国债类资产持相对乐观态度，主要受央行恢复国债购买预期的推动", "date": "2025-05-19"}, {"speaker": "张晶", "text": "主要驱动因素包括关税冲击的缓和以及新一轮货币政策边际宽松", "date": "2025-05-23"}, {"speaker": "刘曼沁", "text": "银行下调存款利率有望打开空间，财政政策配合是关键", "date": "2025-05-23"}, {"speaker": "杨义山", "text": "6月份最大的不确定性在于6月18日陆家嘴金融论坛", "date": "2025-06-13"}, {"speaker": "杨义山", "text": "对7月政策预期与经济下行压力的提前交易", "date": "2025-06-20"}], "PL_006→PL_005": [{"speaker": "武玥", "text": "央行封顶但下行需降息打开。11月缺乏主线。3-5年利差压缩是唯一机会。", "date": "2025-11-07"}, {"speaker": "杨义山", "text": "央行利率区间管理约束长端。10Y以1.80%中枢±3bp震荡。久期回补但稳定性不足。", "date": "2025-11-07"}, {"speaker": "杨义山", "text": "货币政策报告强化利率区间管理，从总体定价转向精细化管理。等待销售新规落地。", "date": "2025-11-14"}], "PL_002→PL_005": [{"speaker": "武玥", "text": "央行封顶但下行需降息打开。11月缺乏主线。3-5年利差压缩是唯一机会。", "date": "2025-11-07"}, {"speaker": "杨义山", "text": "央行利率区间管理约束长端。10Y以1.80%中枢±3bp震荡。久期回补但稳定性不足。", "date": "2025-11-07"}, {"speaker": "杨义山", "text": "货币政策报告强化利率区间管理，从总体定价转向精细化管理。等待销售新规落地。", "date": "2025-11-14"}], "LQ_002→LQ_001": [{"speaker": "赵骥", "text": "资金宽松主因有二：一是高息定存到期后约90%-95%以短期低息负债形式留存银行体系", "date": "2026-04-03"}, {"speaker": "赵骥", "text": "二是人民币兑美元汇率从7.0升值至6.87附近，结售汇因素对流动性形成隐性补充", "date": "2026-04-03"}, {"speaker": "沈文思", "text": "央行宽松取向未变，经济收紧概率较低，短端资产相对更安全", "date": "2026-04-03"}, {"speaker": "徐天彤", "text": "当前银行体系流动性保持均衡偏松格局，央行公开市场操作更注重价格引导而非数量投放，短端资产确定性较高", "date": "2026-04-03"}, {"speaker": "徐天彤", "text": "加权资金利率降至1.27附近，大型银行融出规模月初已恢复至5万亿水平，符合季度末后季节性回升规律", "date": "2026-04-03"}, {"speaker": "徐天彤", "text": "下周影响资金面因素有限，预计维持均衡或偏松状态", "date": "2026-04-03"}, {"speaker": "项墩伟", "text": "当前债市短端韧性强于长端，资金面稳定偏松构成最大确定性", "date": "2026-04-03"}, {"speaker": "武玥", "text": "短端资金面维持宽松格局，曲线呈现短端极致压缩特征", "date": "2026-04-03"}, {"speaker": "武玥", "text": "市场资金面仍非常宽松，短端资产表现强劲", "date": "2026-04-03"}, {"speaker": "张帆", "text": "短端利率下行超预期但空间有限，强劲配置力量支撑信用债低位运行", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "DR001维持在1.27%附近，资金极松，但这更像短期状态而非稳态", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "若后续净回笼延续，DR001中枢大概率回到1.30%-1.35%，R007也难持续低于1.45%", "date": "2026-04-03"}, {"speaker": "张迪", "text": "短端资金宽松致交易拥挤但下行空间有限，策略上宜持有不追涨、以活期过渡加杠杆增厚", "date": "2026-04-03"}, {"speaker": "张迪", "text": "当前资金面极度宽松，隔夜利率约1.3%、DR001降至1.2%区间、R001亦处低位，大行融出价格同步下行", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "资金面宽松持续性待观察", "date": "2026-04-03"}, {"speaker": "李博良", "text": "国内资金面方面，3月中旬以来纯债基金申购回升，一季度定价权主要在银行，二季度边际定价权或向基金转移", "date": "2026-04-03"}, {"speaker": "李博良", "text": "4月中旬缴税压力对资金面的扰动需密切观察", "date": "2026-04-03"}, {"speaker": "共识", "text": "资金面虽然易松难紧，但其边际变化至关重要，即将到来的4月税期被视为检验资金面持续性的关键窗口", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "资金链持续宽松时短端和信用票息类资产占优", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "4月税期是验证资金面的重要窗口期", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "资金链易松难紧且为慢变量，一旦出现拐点持续性会比预期更长", "date": "2026-04-10"}, {"speaker": "张晶", "text": "资金面极度宽松仍是当前最坚实支撑", "date": "2026-04-10"}, {"speaker": "徐天彤", "text": "当前资金面维持均衡偏松但价格已处低位，进一步下行空间有限", "date": "2026-04-10"}, {"speaker": "徐天彤", "text": "银行负债端尚无不稳迹象，3月以来偏松格局受益于年初1-2月中长期资金大额投放", "date": "2026-04-10"}, {"speaker": "徐天彤", "text": "4月除4月20日缴税大月外，其他资金面扰动因素较小", "date": "2026-04-10"}, {"speaker": "项墩伟", "text": "鱼尾长度取决于资金宽松持续性和债基理财配置资金持续性", "date": "2026-04-10"}, {"speaker": "张迪", "text": "因活期与资金间存在利差，非银机构减少融出、将资金存放银行，导致银行体系资金充裕，DR007等价格维持低位", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "公开市场操作维持地板量状态预计延续至4月20日税期", "date": "2026-04-10"}, {"speaker": "李博良", "text": "人民币在升值通道中可能伴随流动性流入，短期资金面大幅收敛概率不大", "date": "2026-04-10"}, {"speaker": "沈文思", "text": "央行通过买断式逆回购或地量OMO回笼中长期流动性，但单次规模温和，资金利率仍维持历史低位", "date": "2026-04-17"}, {"speaker": "徐天彤", "text": "当前银行体系流动性处于季节性高位，资金面呈自发性宽松态势", "date": "2026-04-17"}, {"speaker": "项墩伟", "text": "金融时报文章安抚市场及大行负债端指标来看仍处季节性高位，中期流动性维持稳定概率较高", "date": "2026-04-17"}, {"speaker": "武玥", "text": "流动性自发性宽松格局延续，债市阻力最小方向仍是利差压缩", "date": "2026-04-17"}, {"speaker": "武玥", "text": "在央行没有显著收敛资金的情况下，历史上快速上行的可能性较小，更多是维持惯性震荡", "date": "2026-04-17"}, {"speaker": "王俊华", "text": "整体处于偏右侧环境，流动性是债市走强的核心支撑", "date": "2026-04-17"}, {"speaker": "李博良", "text": "资金充裕、资金利率偏低，导致大家等待成本很高，被动式提升久期，各组合久期一直在往上加", "date": "2026-04-17"}, {"speaker": "李博良", "text": "短端利率的确定性相对较高...随着季末临近，场外观望资金可能逐步进场配置", "date": "2025-03-14"}, {"speaker": "张迪", "text": "下周是税期，加上中期借贷便利（MLF）错位的情况，可能会导致大量资金回笼", "date": "2025-04-03"}, {"speaker": "高喆", "text": "自4月中旬以来，央行在资金投放细节上的关注度明显提升", "date": "2025-05-09"}, {"speaker": "张迪", "text": "当前市场已基本完成双向定价，资金宽松逻辑初步交易完毕", "date": "2025-05-19"}, {"speaker": "张迪", "text": "1.7以上的存单仍具备配置价值", "date": "2025-06-06"}, {"speaker": "柴颖颖", "text": "债市整体观点从中性偏多转为中性", "date": "2025-06-26"}, {"speaker": "杨义山", "text": "资金面预计跨季后中性偏松", "date": "2025-06-26"}, {"speaker": "张迪", "text": "存单稳定1.67%-1.68%。四季度资金波动可能上升。降息是短端下行关键。长端不参与。", "date": "2025-09-19"}], "LQ_002→LQ_005": [{"speaker": "徐天彤", "text": "需重点关注下周大税期来临及税后跨月压力，以及隔夜利率长期偏低背景下央行引导价格小幅回升的可能性", "date": "2026-04-17"}, {"speaker": "张迪", "text": "仍看好长端，短端亦有一定支撑；\"活期利率1.4%\"约束正在松动", "date": "2026-04-17"}, {"speaker": "张迪", "text": "一旦下调之后，短端资产的定价锚将再次下移，形成一轮新的短端下行驱动", "date": "2026-04-17"}, {"speaker": "杨义山", "text": "银行自律行为导致的自发性宽松（本周陆续有银行在结息周期内临时下调活期存款利率），整个债市仍有一定支撑", "date": "2026-04-17"}, {"speaker": "李博良", "text": "若活期存款大面积下调，短端锚将再次下移，可能形成\"左脚踩右脚\"的自我强化式下行", "date": "2026-04-17"}, {"speaker": "张迪", "text": "后续资金预计不会进一步下行，1.6%以下的存单性价比不高。从季节性、央行回笼、政府债供给、套利空间四方面论证资金进一步下行概率低。存单从绝对点位和比价角度均不具优势，操作上建议观望。", "date": "2025-07-04"}, {"speaker": "张迪", "text": "长端受权益主导操作难度高。央行操作矛盾但配合发债意图明确。8月存单季节性上行规律需警惕，避开8月中下旬。信用利差极端水平下削减信用债配置，转向存单及存款品种。重点提示建行可能重启高息定期存款机会。", "date": "2025-07-18"}, {"speaker": "张迪", "text": "资金极度宽松引发套利循环，银行降活期利率促使资金转向现金管理理财。央行呵护意愿强烈但波动可能加大。短期资金利率突破至1.66%，预计低波窄幅震荡持续。长端下行空间小需等待催化剂。", "date": "2025-08-08"}, {"speaker": "孔祥雨", "text": "资金面净回笼但短端信用仍有40-50bp利差。资本利得有限，多头抱团已瓦解，利率债偏空。银行提价发存单预示价格可能上行。计划8月下旬至9月逐步布局。", "date": "2025-08-15"}], "LQ_001→LQ_005": [{"speaker": "徐天彤", "text": "需重点关注下周大税期来临及税后跨月压力，以及隔夜利率长期偏低背景下央行引导价格小幅回升的可能性", "date": "2026-04-17"}, {"speaker": "张迪", "text": "仍看好长端，短端亦有一定支撑；\"活期利率1.4%\"约束正在松动", "date": "2026-04-17"}, {"speaker": "张迪", "text": "一旦下调之后，短端资产的定价锚将再次下移，形成一轮新的短端下行驱动", "date": "2026-04-17"}, {"speaker": "杨义山", "text": "银行自律行为导致的自发性宽松（本周陆续有银行在结息周期内临时下调活期存款利率），整个债市仍有一定支撑", "date": "2026-04-17"}, {"speaker": "李博良", "text": "若活期存款大面积下调，短端锚将再次下移，可能形成\"左脚踩右脚\"的自我强化式下行", "date": "2026-04-17"}, {"speaker": "张迪", "text": "后续资金预计不会进一步下行，1.6%以下的存单性价比不高。从季节性、央行回笼、政府债供给、套利空间四方面论证资金进一步下行概率低。存单从绝对点位和比价角度均不具优势，操作上建议观望。", "date": "2025-07-04"}, {"speaker": "张迪", "text": "长端受权益主导操作难度高。央行操作矛盾但配合发债意图明确。8月存单季节性上行规律需警惕，避开8月中下旬。信用利差极端水平下削减信用债配置，转向存单及存款品种。重点提示建行可能重启高息定期存款机会。", "date": "2025-07-18"}, {"speaker": "张迪", "text": "资金极度宽松引发套利循环，银行降活期利率促使资金转向现金管理理财。央行呵护意愿强烈但波动可能加大。短期资金利率突破至1.66%，预计低波窄幅震荡持续。长端下行空间小需等待催化剂。", "date": "2025-08-08"}, {"speaker": "孔祥雨", "text": "资金面净回笼但短端信用仍有40-50bp利差。资本利得有限，多头抱团已瓦解，利率债偏空。银行提价发存单预示价格可能上行。计划8月下旬至9月逐步布局。", "date": "2025-08-15"}], "LQ_004→LQ_003": [{"speaker": "张帆", "text": "短端方面，存单利率近期下行幅度超预期（今日再降3BP），资金利率处于极低水平", "date": "2026-04-03"}, {"speaker": "李博良", "text": "存单价格下破1.5%至历史低位超预期，3月央行回笼操作下资金面仍保持平稳", "date": "2026-04-03"}, {"speaker": "张迪", "text": "本周评分边际变化在于存单评分从三分下调至两分", "date": "2026-04-10"}, {"speaker": "徐天彤", "text": "存单利率延续3月以来下行趋势，3月以来已连续下行达11BP", "date": "2026-04-17"}, {"speaker": "张帆", "text": "在存单基础上适度上移久期，2～3年国开债自调整以来已下行4～5BP，票息与久期拉升效果显著", "date": "2026-04-17"}, {"speaker": "张迪", "text": "短端政金债作为现金替代券种，其定价主要参考OMO利率，在当前环境下已基本合理", "date": "2025-05-09"}, {"speaker": "张迪", "text": "下周是观察资金面和存单走势的一个关键窗口", "date": "2025-06-06"}, {"speaker": "张迪", "text": "短端低波延续，降息概率低。1.68%存单适合套息配置但资本利得难。", "date": "2025-10-17"}], "LQ_003→LQ_005": [{"speaker": "徐天彤", "text": "需重点关注下周大税期来临及税后跨月压力，以及隔夜利率长期偏低背景下央行引导价格小幅回升的可能性", "date": "2026-04-17"}, {"speaker": "张迪", "text": "仍看好长端，短端亦有一定支撑；\"活期利率1.4%\"约束正在松动", "date": "2026-04-17"}, {"speaker": "张迪", "text": "一旦下调之后，短端资产的定价锚将再次下移，形成一轮新的短端下行驱动", "date": "2026-04-17"}, {"speaker": "杨义山", "text": "银行自律行为导致的自发性宽松（本周陆续有银行在结息周期内临时下调活期存款利率），整个债市仍有一定支撑", "date": "2026-04-17"}, {"speaker": "李博良", "text": "若活期存款大面积下调，短端锚将再次下移，可能形成\"左脚踩右脚\"的自我强化式下行", "date": "2026-04-17"}, {"speaker": "张迪", "text": "后续资金预计不会进一步下行，1.6%以下的存单性价比不高。从季节性、央行回笼、政府债供给、套利空间四方面论证资金进一步下行概率低。存单从绝对点位和比价角度均不具优势，操作上建议观望。", "date": "2025-07-04"}, {"speaker": "张迪", "text": "长端受权益主导操作难度高。央行操作矛盾但配合发债意图明确。8月存单季节性上行规律需警惕，避开8月中下旬。信用利差极端水平下削减信用债配置，转向存单及存款品种。重点提示建行可能重启高息定期存款机会。", "date": "2025-07-18"}, {"speaker": "张迪", "text": "资金极度宽松引发套利循环，银行降活期利率促使资金转向现金管理理财。央行呵护意愿强烈但波动可能加大。短期资金利率突破至1.66%，预计低波窄幅震荡持续。长端下行空间小需等待催化剂。", "date": "2025-08-08"}, {"speaker": "孔祥雨", "text": "资金面净回笼但短端信用仍有40-50bp利差。资本利得有限，多头抱团已瓦解，利率债偏空。银行提价发存单预示价格可能上行。计划8月下旬至9月逐步布局。", "date": "2025-08-15"}], "LQ_002→LQ_003": [{"speaker": "张帆", "text": "短端方面，存单利率近期下行幅度超预期（今日再降3BP），资金利率处于极低水平", "date": "2026-04-03"}, {"speaker": "李博良", "text": "存单价格下破1.5%至历史低位超预期，3月央行回笼操作下资金面仍保持平稳", "date": "2026-04-03"}, {"speaker": "张迪", "text": "本周评分边际变化在于存单评分从三分下调至两分", "date": "2026-04-10"}, {"speaker": "徐天彤", "text": "存单利率延续3月以来下行趋势，3月以来已连续下行达11BP", "date": "2026-04-17"}, {"speaker": "张帆", "text": "在存单基础上适度上移久期，2～3年国开债自调整以来已下行4～5BP，票息与久期拉升效果显著", "date": "2026-04-17"}, {"speaker": "张迪", "text": "短端政金债作为现金替代券种，其定价主要参考OMO利率，在当前环境下已基本合理", "date": "2025-05-09"}, {"speaker": "张迪", "text": "下周是观察资金面和存单走势的一个关键窗口", "date": "2025-06-06"}, {"speaker": "张迪", "text": "短端低波延续，降息概率低。1.68%存单适合套息配置但资本利得难。", "date": "2025-10-17"}], "MS_001→MS_004": [{"speaker": "高喆", "text": "短端动量因子38分略偏多，期货基差因子由前周略偏高转为略偏低", "date": "2026-04-10"}, {"speaker": "高喆", "text": "伴随中短持续下行，长端绝对点位相比短端信用债较高，尤其是地方债", "date": "2026-04-10"}, {"speaker": "姜之媛", "text": "长端10年国债若触及1.85%可小仓位博弈", "date": "2026-04-10"}, {"speaker": "姜之媛", "text": "若资金继续宽松可做多中短端博波段，若长端因外部因素调整（如10年国债触及1.85%）可小仓位博弈", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "曲线极度陡峭后，资金有望从1Y附近逐步转向10Y国开等中长端利差品种", "date": "2026-04-10"}, {"speaker": "武玥", "text": "在应对供给扰动期间，市场未出现明显回调，说明情绪仍偏强，应遵循纪律保有长端仓位", "date": "2026-04-17"}, {"speaker": "姜之媛", "text": "基金在中长债券上的敞口暴露已回到两位数、但距极值最高位仍有一定距离，30年或还有一些空间", "date": "2026-04-17"}, {"speaker": "张帆", "text": "一直看好10年国开，目前所有账户的10年国开比例均已达到10%以上", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "30年国债、10年国开、15～20年地方债本质上都是对当前曲线陡峭度的修正，均可适量配置", "date": "2026-04-17"}, {"speaker": "李博良", "text": "市场走势略超预期，短期资金宽松支撑不变，等待成本过高导致被动式拉久期", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "今年市场的复杂性和多变性使得依赖去年的趋势交易策略变得困难", "date": "2025-04-11"}], "MS_001→MS_006": [{"speaker": "张帆", "text": "中等期限信用债仍有支撑", "date": "2026-04-10"}, {"speaker": "武玥", "text": "中长期票息策略仍是当前最优方向，中短品种目前不受资金面制约", "date": "2026-04-17"}, {"speaker": "武玥", "text": "二永供给冲击更可能以利差被动走阔、相对滞涨的方式消化，真实冲击有限", "date": "2026-04-17"}, {"speaker": "柴颖颖", "text": "长期来看，信用债仍有一定的配置需求", "date": "2025-04-03"}, {"speaker": "孔祥雨", "text": "更倾向于重视信用债的票息价值，而非继续期待信用利差收窄", "date": "2025-04-25"}], "MS_001→MS_003": [{"speaker": "共识", "text": "全球资产进入\"贝叶斯定价\"模式，波动率攀升，传统分析框架面临挑战", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "内需修复节奏不畅、避险情绪升温及股市波动等因素导致部分资金拥挤于短债、货基等短期限品种，推高期限利差", "date": "2026-04-03"}, {"speaker": "高喆", "text": "短端动量因子处于震荡区间，短端需求虽仍旺盛但当前点位保护已不充足", "date": "2026-04-03"}, {"speaker": "张迪", "text": "导致短端交易较为拥挤", "date": "2026-04-03"}, {"speaker": "项墩伟", "text": "30-10利差空间不算窄，但是市场担忧目前30Y的活跃券都有可能被抛弃，实操择券难度大", "date": "2026-04-10"}, {"speaker": "高喆", "text": "中短债理财的需求旺盛，但进一步压缩的空间不足", "date": "2026-04-10"}, {"speaker": "李博良", "text": "5年二永下行较多后超额收益已不显著，市场正从5年高等级向中等级信用资质延伸", "date": "2026-04-10"}, {"speaker": "姜之媛", "text": "中短端性价比极低、套息拥挤", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "中端因拥挤度面临压力", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "中端（1-5年）因持仓集中、下注最多而面临拥挤度压力，交易机会转瞬即逝且难以抓取", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "本轮二永债行情从八九十分位全面介入，现已下行至30分位...当前已进入鱼尾行情，未配置者不宜再追", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "纯债基申购旺盛，短端交易较拥挤", "date": "2026-04-10"}, {"speaker": "武玥", "text": "利差压缩后各品类价值均处低位，市场到去α保留β阶段。有胜率没赔率，交易盘抢跑后止盈压力需关注。维持区间1.6%-1.65%判断，信用二永考虑哑铃策略。", "date": "2025-07-04"}, {"speaker": "姜之媛", "text": "今天市场非理性下跌由未经证实的消息引发黑色系暴涨所致。市场情绪过度聚焦政治局会议预期。固收+底层逻辑未动摇，但若有效需求刺激超预期将果断降久期。ETF大额净流入提供缓冲，但需警惕场内ETF被当作提款机。", "date": "2025-07-29"}, {"speaker": "柴颖颖", "text": "跌幅已基本到位但反弹空间受权益压制。终局思维在债市表现远不及股商。当前行情与2023年初类似。若商品验证需求回升则调整加剧。根据产品特性适度减仓控制风险暴露。", "date": "2025-07-29"}, {"speaker": "武玥", "text": "市场延续上周逻辑但波动性显著加剧。机构分化：匀速卖出vs集中处理高税负品种。技术面关键位突破可能引发整体震荡。加仓时机需结合政策预期与资金面动态。", "date": "2025-07-29"}, {"speaker": "李博良", "text": "市场脆弱平衡情绪过度反应，修复不可持续。利率反复震荡需等待通胀叙事验证。采取高频波段策略：高位加仓配合止盈。资产配置向高等级倾斜以规避零售端资金异动。", "date": "2025-07-29"}], "MS_003→MS_005": [{"speaker": "共识", "text": "市场已度过赔率最丰厚的阶段，预计将维持震荡，业绩分化可能持续", "date": "2026-04-10"}, {"speaker": "张迪", "text": "长端观点维持与上周一致，态度并不悲观...曲线陡峭化行情已略有扭转、稍走平坦，主因短端利率过低，长端性价比相对突出", "date": "2026-04-10"}, {"speaker": "武玥", "text": "长端赔率相对更有吸引力但需等待催化剂", "date": "2026-04-10"}, {"speaker": "武玥", "text": "长端维持不悲观判断，从陡峭稍微有所扭转走平了一点，长端性价比相对更有吸引力", "date": "2026-04-10"}, {"speaker": "武玥", "text": "长端赔率此前处于极高位置（对应99%分位），目前边际下降至97%-96%分位附近", "date": "2026-04-10"}, {"speaker": "柴颖颖", "text": "资金宽松提供底部支撑但赔率最丰厚阶段已过，建议保持谨慎", "date": "2026-04-10"}, {"speaker": "张帆", "text": "短端和存单价格已极度极限", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "短端则因资金价格已处边际鸡肋水平而面临压力。因此，本周将存单打分调整为两分", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "相较于1.8%出头的国债、1.9%出头的国开及波动剧烈的30年超长期国债，地方债恰为压舱长端的相对良好的工具", "date": "2026-04-10"}, {"speaker": "共识", "text": "当前处于\"高胜率、低赔率\"的象限，资金宽松的格局短期难以逆转，市场下行风险有限", "date": "2026-04-17"}, {"speaker": "赵骥", "text": "债市当前处于高胜率、低赔率象限——收益率大幅下行的赔率已很有限，但资金宽松主线短期不会逆转", "date": "2026-04-17"}, {"speaker": "李博良", "text": "在当前位置建议先观望，特别是关注下周存单能否企稳", "date": "2025-03-10"}, {"speaker": "武玥", "text": "整体而言，长端利率的胜率较低，而中短端具有一定的配置价值", "date": "2025-03-10"}, {"speaker": "武玥", "text": "建议倾向于持有能够算得过账的品种，例如下沉一些的两年期信用债", "date": "2025-03-10"}, {"speaker": "武玥", "text": "倾向于采取相对保守的态度，并建议在信用品种中寻找机会", "date": "2025-03-14"}, {"speaker": "武玥", "text": "当前有一个边际变化，即开始寻找长端的买点", "date": "2025-03-21"}, {"speaker": "武玥", "text": "在3月份保持谨慎态度的基础上，4月份应寻找合适的买入点", "date": "2025-03-28"}, {"speaker": "张帆", "text": "对于二季度债券利率市场的看法是不宜过度看空，预计整体市场将呈现震荡态势", "date": "2025-03-28"}, {"speaker": "姜之媛", "text": "市场预期处于一个较为中间的状态，并非极度悲观也未过度乐观", "date": "2025-04-03"}, {"speaker": "张帆", "text": "4月上旬可能是较好的做多窗口", "date": "2025-04-03"}, {"speaker": "武玥", "text": "债市已迅速反映了这些情绪冲击。二季度可能的降准措施预计会缓解流动性压力", "date": "2025-04-11"}, {"speaker": "李博良", "text": "短期内市场方向不明，政策性因素可能成为关键变量", "date": "2025-04-18"}, {"speaker": "武玥", "text": "策略上建议适度杠杆，围绕中位数久期进行波段操作", "date": "2025-04-18"}, {"speaker": "张帆", "text": "1-3年期信用债具有较高配置价值，正套空间约为30-40bp，建议加大配置力度", "date": "2025-04-18"}, {"speaker": "柴颖颖", "text": "当前市场处于一个相对中性的位置", "date": "2025-04-18"}, {"speaker": "姜之媛", "text": "不建议过度拉长久期，需保持波段操作思路", "date": "2025-04-18"}, {"speaker": "武玥", "text": "当前的投资策略应该是积累小胜为大胜", "date": "2025-04-25"}, {"speaker": "张帆", "text": "整体债券市场将继续维持震荡走势", "date": "2025-04-25"}, {"speaker": "武玥", "text": "整体上行风险不大，曲线可能先陡后平，信用继续补充票息资产", "date": "2025-05-09"}, {"speaker": "姜之媛", "text": "牛市基础尚存，但短期内受制于宽幅震荡格局，交易难度有所上升", "date": "2025-05-09"}, {"speaker": "张帆", "text": "当前对债券资产的看法进行了适度调整，总体上认同后续利率下行过程可能不会一蹴而就", "date": "2025-05-09"}, {"speaker": "李博良", "text": "当前市场可能处于震荡略偏多的状态，收益率曲线预计将经历先陡峭后平坦的过程", "date": "2025-05-09"}, {"speaker": "李博良", "text": "预期利率在1.65-1.70之间波动", "date": "2025-05-19"}, {"speaker": "姜之媛", "text": "市场进入调仓和观望阶段", "date": "2025-05-19"}, {"speaker": "张帆", "text": "关注1.8以上点位配置价值", "date": "2025-05-19"}, {"speaker": "柴颖颖", "text": "当前阶段对配置盘相对友好，但对交易盘而言操作难度较大", "date": "2025-05-19"}, {"speaker": "孔祥雨", "text": "当前整体宽松趋势已进入尾声，利率水平上下空间均有限", "date": "2025-05-19"}, {"speaker": "武玥", "text": "当前的投资策略应该是积累小胜为大胜", "date": "2025-05-23"}, {"speaker": "张帆", "text": "整体债券市场将继续维持震荡走势", "date": "2025-05-23"}, {"speaker": "武玥", "text": "6月调整或提供加仓机会", "date": "2025-05-30"}, {"speaker": "张帆", "text": "关注1.8以上点位配置价值", "date": "2025-05-30"}, {"speaker": "李博良", "text": "信用债短端利差压缩殆尽，配置价值有限", "date": "2025-05-30"}, {"speaker": "武玥", "text": "6月利率品种或将优于信用品种", "date": "2025-06-06"}, {"speaker": "柴颖颖", "text": "整体策略仍以稳健为主", "date": "2025-06-06"}, {"speaker": "张帆", "text": "1-3年期信用债具有较高配置价值", "date": "2025-06-06"}, {"speaker": "张帆", "text": "利率下行方向依然明确", "date": "2025-06-13"}, {"speaker": "李博良", "text": "建议在定价合理位置择机退出超长端持仓", "date": "2025-06-20"}, {"speaker": "张帆", "text": "预计7月初为半年度自发性宽松周期的终点", "date": "2025-06-20"}, {"speaker": "李博良", "text": "10Y国债1.70%中性偏鸡肋。8月上旬顺风窗口但利率下行不及预期，窗口可能关闭。核心矛盾是长端赔率不足。以赔率为导向波段操作：低时降久期，赔率打开再加仓。", "date": "2025-08-08"}, {"speaker": "武玥", "text": "维持1.8关键点位判断。看似脱敏实为节奏博弈。1.85可直接博弈，1.85-1.9需边走边看。93阅兵为节奏关键节点。仓位不宜过重需快速反应。", "date": "2025-08-28"}, {"speaker": "蒋苑", "text": "从偏低仓位调至中性略偏多。久期极低提供加仓空间。费率新规冲击有限。", "date": "2025-10-30"}], "MS_014→MS_001": [{"speaker": "共识", "text": "当前市场处于 \"多空激烈博弈\" 的拉锯状态，分歧显著", "date": "2026-04-03"}, {"speaker": "共识", "text": "地缘政治（美伊冲突）、输入性通胀（油价）和国内经济内需的持续性，共同构成了市场的主要不确定性来源", "date": "2026-04-03"}, {"speaker": "赵骥", "text": "本周多空观点分歧较前两周明显扩大", "date": "2026-04-03"}, {"speaker": "张晶", "text": "当前全球资产已进入\"贝叶斯定价模式\"，即依据高频涌现的新信息以日度频度动态修正资产价格，导致各类资产波动率大幅攀升、相关性紊乱", "date": "2026-04-03"}, {"speaker": "徐天彤", "text": "长端债券受通胀预期、供给压力及地缘政治等多重因素扰动，趋势性机会有限", "date": "2026-04-03"}, {"speaker": "项墩伟", "text": "目前债市存在较大的分歧，对于地缘因素持续时间及影响，输入性通胀的影响市场存在不同的解读", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "当前债市处于多空激烈博弈的拉锯状态，短期不确定性仍存", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "目前债市整体预期仍偏乐观", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "债市短期维持窄幅震荡格局，多空力量拉锯下适合以票息策略为主", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "债券近期走势超预期偏强，10年期国债全周窄幅震荡约2BP", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "一是衰退交易预期边际升温，收益率曲线陡峭化（30-10、10-1均走阔）赋予资金压缩利差的动力", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "二是A股及全球Risk off环境下机构资金流入债市体现避险需求", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "当前多空力量相互牵制，市场分歧显著（卖方路演观点一多一空）", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "衰退可能逐步显现，债券或相对权益与商品先行见底，后续需逐步跟踪资产边际变化并调整配置思路", "date": "2026-04-03"}, {"speaker": "高喆", "text": "本周债券曲线绝对水平及陡峭程度预计均呈震荡格局，策略上维持中性观点", "date": "2026-04-03"}, {"speaker": "高喆", "text": "长端点位偏高但基本面与供给预期制约其表现，曲线或从走陡逐步转向走平", "date": "2026-04-03"}, {"speaker": "高喆", "text": "上周策略观点预测曲线绝对水平震荡、陡峭程度略微看陡，实际运行结果基本验证判断：5年期二永债收益率下行0.4BP，30-5年期利差走阔2.7BP", "date": "2026-04-03"}, {"speaker": "高喆", "text": "本周观点维持与上周持平，曲线绝对水平及陡峭程度预计均呈震荡态势", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "市场对流动性宽松已有一致预期，短端交易情绪强于长端", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "市场情绪谨慎略空", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "利率整体维持中性评分", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "公募产品跟踪显示，两会以来景气中枢从3.9略降至3.7，但久期分歧度快速压缩至2年以内水平，反映市场处于谨慎略空状态", "date": "2026-04-03"}, {"speaker": "李博良", "text": "地缘政治方面，中东局势存在两条逻辑：短线关注冲突是否结束，市场已对特朗普讲话边际脱敏，黄金等避险资产敏感度下降", "date": "2026-04-03"}, {"speaker": "共识", "text": "驱动市场的主线正在发生变化：早期由地缘政治冲突等因素主导的定价逻辑逐步淡化，国内资金面的宽松程度已成为当前市场的核心支撑和主要观察维度", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "地缘冲突若再度升级，长端超长端有交易性机会", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "地缘风险对各类资产的影响已逐步钝化，回归国内自身逻辑", "date": "2026-04-10"}, {"speaker": "张晶", "text": "短期内多空因素博弈中情绪面或占据首要位置", "date": "2026-04-10"}, {"speaker": "高喆", "text": "市场对长端情绪已告别谨慎状态，对冲成本降低", "date": "2026-04-10"}, {"speaker": "高喆", "text": "期货基差因子-0.003元，从略偏高位置转向略偏低位置。显示市场对长端告别谨慎情绪，对冲成本转低", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "短期内债市定价或主要受外部情绪传导及长端换券因素影响", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "后续曲线走向取决于税期前后资金面修正幅度及外部市场情绪传导", "date": "2026-04-10"}, {"speaker": "李博良", "text": "市场情绪相对偏平", "date": "2026-04-10"}, {"speaker": "李博良", "text": "市场对美伊冲突的再钝化趋势明显...短期对通胀交易趋于钝化", "date": "2026-04-10"}, {"speaker": "张帆", "text": "当前市场分歧较大，外部冲突的不确定性对交易有扰动，但后续影响或趋于自动化", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "美伊冲突对债市最尖锐影响已过，当前债市情绪与机构行为主导市场定价", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "美伊冲突作为前期交易热点，其对国内债市最尖锐的影响时段已过，后续更多是通过股债跷跷板、机构行为及资本流向等形式渐进式、反复递进地淡化", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "当前情绪正从追逐短端，切向等待曲线趋平和长端性价比修复", "date": "2026-04-10"}, {"speaker": "李博良", "text": "市场更倾向于震荡偏多，但从当前观察来看，操作时机并不理想", "date": "2025-04-25"}, {"speaker": "李博良", "text": "市场更倾向于震荡偏多，但从当前观察来看，操作时机并不理想", "date": "2025-05-23"}, {"speaker": "张晶", "text": "季末、半年末银行因考核压力可能引发的操作扰动", "date": "2025-06-13"}, {"speaker": "刘曼沁", "text": "10Y前低约在1.65，目前仍未突破", "date": "2025-06-13"}, {"speaker": "武玥", "text": "反映出市场对三季度经济触底和政策转向的强预期", "date": "2025-06-20"}, {"speaker": "武玥", "text": "当前处于存量博弈阶段，操作难度极大。久期高位结构脆弱，技术性操作易失效。应降低操作精度要求，避免盲目止损或追高，等待央行宽松兑现。坚守债市底气来自中美博弈与稳就业对宽松货币环境的需要。", "date": "2025-07-18"}, {"speaker": "姜之媛", "text": "债市最缺乏内生稳定性，走势完全依赖权益市场。超长债交易面临多重困境：换券频繁、期现背离、行情碎片化。基于五因子模型评估，基本面利多已被充分定价，风险偏好成核心风险点。需警惕居民理财行为变化，放弃股债双牛预期转向票息策略控制久期。", "date": "2025-07-18"}, {"speaker": "张帆", "text": "债市进入高难度交易阶段，权益更占优。理财规模仅增2000亿反映固收吸引力下降。存单交易空间持续收窄。以中性久期+票息策略为主严守安全边际。", "date": "2025-08-08"}, {"speaker": "张帆", "text": "大类资产轮动处于极致位置。股市风偏顶峰+债市临近脱敏。股债两侧均面临左侧考验，短期债市可能存在下行修复机会。", "date": "2025-08-15"}, {"speaker": "杨义山", "text": "核心驱动已从基本面转向市场预期变化。股市好Beta挤压债市坏Beta。脆弱性来源：情绪冲击+PPI向CPI传导。债市最大支撑仍是央行资金面操作。后续锯齿状波动需警惕事件催化。", "date": "2025-08-15"}, {"speaker": "汪磊", "text": "费率调整冲击负债端，四季度需注重负债端管理。权益参照2014年底走势维持上行判断。转债波动更大但方向与权益一致。", "date": "2025-09-12"}, {"speaker": "孔祥雨", "text": "股市看上攻4000点，债市有安全边际但不急于增配。操作仅限波段交易，警惕倒车卖人风险。四季度等更好时机。", "date": "2025-09-12"}, {"speaker": "武玥", "text": "股市有政策顶3800-3900，债市上有顶下有底。短期受股债联动，中期回归基本面。", "date": "2025-09-19"}, {"speaker": "姜之媛", "text": "观点从谨慎调至中性，贸易战带来边际改善。短期仍谨慎，短信用债套息有效。", "date": "2025-10-17"}], "MS_008→MS_001": [{"speaker": "共识", "text": "当前市场处于 \"多空激烈博弈\" 的拉锯状态，分歧显著", "date": "2026-04-03"}, {"speaker": "共识", "text": "地缘政治（美伊冲突）、输入性通胀（油价）和国内经济内需的持续性，共同构成了市场的主要不确定性来源", "date": "2026-04-03"}, {"speaker": "赵骥", "text": "本周多空观点分歧较前两周明显扩大", "date": "2026-04-03"}, {"speaker": "张晶", "text": "当前全球资产已进入\"贝叶斯定价模式\"，即依据高频涌现的新信息以日度频度动态修正资产价格，导致各类资产波动率大幅攀升、相关性紊乱", "date": "2026-04-03"}, {"speaker": "徐天彤", "text": "长端债券受通胀预期、供给压力及地缘政治等多重因素扰动，趋势性机会有限", "date": "2026-04-03"}, {"speaker": "项墩伟", "text": "目前债市存在较大的分歧，对于地缘因素持续时间及影响，输入性通胀的影响市场存在不同的解读", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "当前债市处于多空激烈博弈的拉锯状态，短期不确定性仍存", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "目前债市整体预期仍偏乐观", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "债市短期维持窄幅震荡格局，多空力量拉锯下适合以票息策略为主", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "债券近期走势超预期偏强，10年期国债全周窄幅震荡约2BP", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "一是衰退交易预期边际升温，收益率曲线陡峭化（30-10、10-1均走阔）赋予资金压缩利差的动力", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "二是A股及全球Risk off环境下机构资金流入债市体现避险需求", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "当前多空力量相互牵制，市场分歧显著（卖方路演观点一多一空）", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "衰退可能逐步显现，债券或相对权益与商品先行见底，后续需逐步跟踪资产边际变化并调整配置思路", "date": "2026-04-03"}, {"speaker": "高喆", "text": "本周债券曲线绝对水平及陡峭程度预计均呈震荡格局，策略上维持中性观点", "date": "2026-04-03"}, {"speaker": "高喆", "text": "长端点位偏高但基本面与供给预期制约其表现，曲线或从走陡逐步转向走平", "date": "2026-04-03"}, {"speaker": "高喆", "text": "上周策略观点预测曲线绝对水平震荡、陡峭程度略微看陡，实际运行结果基本验证判断：5年期二永债收益率下行0.4BP，30-5年期利差走阔2.7BP", "date": "2026-04-03"}, {"speaker": "高喆", "text": "本周观点维持与上周持平，曲线绝对水平及陡峭程度预计均呈震荡态势", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "市场对流动性宽松已有一致预期，短端交易情绪强于长端", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "市场情绪谨慎略空", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "利率整体维持中性评分", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "公募产品跟踪 。基于五因子模型评估，基本面利多已被充分定价，风险偏好成核心风险点。需警惕居民理财行为变化，放弃股债双牛预期转向票息策略控制久期。", "date": "2025-07-18"}, {"speaker": "张帆", "text": "债市进入高难度交易阶段，权益更占优。理财规模仅增2000亿反映固收吸引力下降。存单交易空间持续收窄。以中性久期+票息策略为主严守安全边际。", "date": "2025-08-08"}, {"speaker": "张帆", "text": "大类资产轮动处于极致位置。股市风偏顶峰+债市临近脱敏。股债两侧均面临左侧考验，短期债市可能存在下行修复机会。", "date": "2025-08-15"}, {"speaker": "杨义山", "text": "核心驱动已从基本面转向市场预期变化。股市好Beta挤压债市坏Beta。脆弱性来源：情绪冲击+PPI向CPI传导。债市最大支撑仍是央行资金面操作。后续锯齿状波动需警惕事件催化。", "date": "2025-08-15"}, {"speaker": "汪磊", "text": "费率调整冲击负债端，四季度需注重负债端管理。权益参照2014年底走势维持上行判断。转债波动更大但方向与权益一致。", "date": "2025-09-12"}, {"speaker": "孔祥雨", "text": "股市看上攻4000点，债市有安全边际但不急于增配。操作仅限波段交易，警惕倒车卖人风险。四季度等更好时机。", "date": "2025-09-12"}, {"speaker": "武玥", "text": "股市有政策顶3800-3900，债市上有顶下有底。短期受股债联动，中期回归基本面。", "date": "2025-09-19"}, {"speaker": "姜之媛", "text": "观点从谨慎调至中性，贸易战带来边际改善。短期仍谨慎，短信用债套息有效。", "date": "2025-10-17"}], "MS_005→MS_004": [{"speaker": "高喆", "text": "短端动量因子38分略偏多，期货基差因子由前周略偏高转为略偏低", "date": "2026-04-10"}, {"speaker": "高喆", "text": "伴随中短持续下行，长端绝对点位相比短端信用债较高，尤其是地方债", "date": "2026-04-10"}, {"speaker": "姜之媛", "text": "长端10年国债若触及1.85%可小仓位博弈", "date": "2026-04-10"}, {"speaker": "姜之媛", "text": "若资金继续宽松可做多中短端博波段，若长端因外部因素调整（如10年国债触及1.85%）可小仓位博弈", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "曲线极度陡峭后，资金有望从1Y附近逐步转向10Y国开等中长端利差品种", "date": "2026-04-10"}, {"speaker": "武玥", "text": "在应对供给扰动期间，市场未出现明显回调，说明情绪仍偏强，应遵循纪律保有长端仓位", "date": "2026-04-17"}, {"speaker": "姜之媛", "text": "基金在中长债券上的敞口暴露已回到两位数、但距极值最高位仍有一定距离，30年或还有一些空间", "date": "2026-04-17"}, {"speaker": "张帆", "text": "一直看好10年国开，目前所有账户的10年国开比例均已达到10%以上", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "30年国债、10年国开、15～20年地方债本质上都是对当前曲线陡峭度的修正，均可适量配置", "date": "2026-04-17"}, {"speaker": "李博良", "text": "市场走势略超预期，短期资金宽松支撑不变，等待成本过高导致被动式拉久期", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "今年市场的复杂性和多变性使得依赖去年的趋势交易策略变得困难", "date": "2025-04-11"}], "IB_001→IB_002": [{"speaker": "项墩伟", "text": "目前3Y及5YAAA-二债利差均处于近一年63%左右分位数，短线看则处于20日均值下方（中性信号）", "date": "2026-04-03"}, {"speaker": "张帆", "text": "同时关注二永债本季度可能的调整机会，若出现回调则性价比相对突出", "date": "2026-04-03"}, {"speaker": "张帆", "text": "不对抗趋势严控久期。短端套息空间罕见（存单1.66%-1.67%信用1.8%资金1.4%-1.5%），与2017年相似。长久期利率难获利，信用以短端套息为主。", "date": "2025-08-28"}], "IB_001→IB_005": [{"speaker": "柴颖颖", "text": "机构行为分歧较大，部分头部基金公司如华夏基金明确看好今年债市，但也有基金经理明确表示不再进一步提升久期", "date": "2026-04-10"}, {"speaker": "李云增", "text": "核心路径为从行为记录出发，逐步实现行为分析、风险控制、关键行为拆解与指标管理", "date": "2025-05-09"}], "IB_012→IB_002": [{"speaker": "项墩伟", "text": "目前3Y及5YAAA-二债利差均处于近一年63%左右分位数，短线看则处于20日均值下方（中性信号）", "date": "2026-04-03"}, {"speaker": "张帆", "text": "同时关注二永债本季度可能的调整机会，若出现回调则性价比相对突出", "date": "2026-04-03"}, {"speaker": "张帆", "text": "不对抗趋势严控久期。短端套息空间罕见（存单1.66%-1.67%信用1.8%资金1.4%-1.5%），与2017年相似。长久期利率难获利，信用以短端套息为主。", "date": "2025-08-28"}], "IB_003→IB_001": [{"speaker": "姜之媛", "text": "本周机构行为上调至4分", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "整体偏多，机构行为打4分，二永配置区间由4～5年收缩至3年附近", "date": "2026-04-17"}, {"speaker": "李博良", "text": "研究员给出的杠杆数据和测算久期数据尚未到非常亢奋的点，微观层面支持曲线仍在走平", "date": "2026-04-17"}, {"speaker": "赵骥", "text": "公募久期快速下降反映谨慎。基本面无实质改善则估值回归。应注重固收+策略设计，探索多元化投资方式。避免过度追涨，等待跌出来的配置机会。", "date": "2025-07-29"}, {"speaker": "赵骥", "text": "理财子回避拉久期公募降久期。安全垫消耗严重基本面定价失效。低利率环境下5bp波动即显著冲击净值。严守安全垫积累原则，通过定制化周报心理按摩，待企稳后重启基本面定价。", "date": "2025-08-15"}, {"speaker": "赵骥", "text": "银行自营为完成KPI涌入可转债导致泡沫化。债市核心在估值过高。存款搬家第一阶段机构外流第二阶段居民滞后。债市需跌出价值。信用优于利率，严控含权仓位。年底机构求稳。", "date": "2025-08-28"}, {"speaker": "李博良", "text": "宽幅震荡1.8%附近有赔率但空头主导。央行托底+配置盘减缓上行。信用债偏空。少犯错优于博收益。", "date": "2025-09-12"}], "IB_013→IB_005": [{"speaker": "柴颖颖", "text": "机构行为分歧较大，部分头部基金公司如华夏基金明确看好今年债市，但也有基金经理明确表示不再进一步提升久期", "date": "2026-04-10"}, {"speaker": "李云增", "text": "核心路径为从行为记录出发，逐步实现行为分析、风险控制、关键行为拆解与指标管理", "date": "2025-05-09"}], "IB_013→IB_001": [{"speaker": "姜之媛", "text": "本周机构行为上调至4分", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "整体偏多，机构行为打4分，二永配置区间由4～5年收缩至3年附近", "date": "2026-04-17"}, {"speaker": "李博良", "text": "研究员给出的杠杆数据和测算久期数据尚未到非常亢奋的点，微观层面支持曲线仍在走平", "date": "2026-04-17"}, {"speaker": "赵骥", "text": "公募久期快速下降反映谨慎。基本面无实质改善则估值回归。应注重固收+策略设计，探索多元化投资方式。避免过度追涨，等待跌出来的配置机会。", "date": "2025-07-29"}, {"speaker": "赵骥", "text": "理财子回避拉久期公募降久期。安全垫消耗严重基本面定价失效。低利率环境下5bp波动即显著冲击净值。严守安全垫积累原则，通过定制化周报心理按摩，待企稳后重启基本面定价。", "date": "2025-08-15"}, {"speaker": "赵骥", "text": "银行自营为完成KPI涌入可转债导致泡沫化。债市核心在估值过高。存款搬家第一阶段机构外流第二阶段居民滞后。债市需跌出价值。信用优于利率，严控含权仓位。年底机构求稳。", "date": "2025-08-28"}, {"speaker": "李博良", "text": "宽幅震荡1.8%附近有赔率但空头主导。央行托底+配置盘减缓上行。信用债偏空。少犯错优于博收益。", "date": "2025-09-12"}], "IB_004→IB_012": [{"speaker": "项墩伟", "text": "二永方面关注下周开始的新发，目前工行、中信、招商均有发行计划，若供给阶段性扰动下二永有所调整，可以适当关注逢高配置机会", "date": "2026-04-03"}, {"speaker": "武玥", "text": "若资金面持续宽松，市场或从避险需求或油价高位可能引发衰退的更长逻辑出发，被动配置资产以获取收益", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "但内需修复预期与机构再平衡行为或推动收益率曲线动态调整", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "若内需呈现逐级修复态势，收益率曲线尤其是短端可能因机构行为（配置户、理财户等）或不同类型资产再平衡过程而需要动态调整", "date": "2026-04-03"}, {"speaker": "王本浩", "text": "二永债新发或带来阶段性布局窗口", "date": "2026-04-03"}, {"speaker": "张帆", "text": "二季度初配置力量显著增强，一季度存款资金释放后委托人欠配压力较大，资金投放力度强劲", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "大行购债并未明显加码，长端配置力量仍偏克制，机构行为呈现\"回补短端、观望长端\"的特征", "date": "2026-04-03"}, {"speaker": "李博良", "text": "机构配置情绪强劲支撑债市，短端利率处历史低位但下行空间有限", "date": "2026-04-03"}, {"speaker": "李博良", "text": "从基金申购及一二级交易行为观察，机构配置情绪显著增强，资产端虽难见大幅下行趋势，但在组合具备安全垫前提下仍愿意参与曲线走平交易", "date": "2026-04-03"}, {"speaker": "张晶", "text": "机构行为分化明显，市场对后市判断存在谨慎与乐观的分歧", "date": "2026-04-10"}, {"speaker": "张迪", "text": "农行和中信等大行近期提价发行存单，城商行发行情况也较为积极", "date": "2025-03-10"}, {"speaker": "赵骥", "text": "银行可能会选择获利了结一些FTP倒挂的资产", "date": "2025-06-13"}, {"speaker": "李博良", "text": "整体偏多，资产上关注前期涨幅较小品种的补涨机会，信用短期内性价比高于利率。存单当前价格合理，R001若稳定在1.4%附近短端预计平稳。赎回压力不大，银行配置需求仍在。维持较高久期，看好3-5Y中等资质信用和ETF长端信用债。", "date": "2025-07-04"}, {"speaker": "姜之媛", "text": "7月行情整体偏乐观但赔率不足。1.6%为短期市场底难突破。跨季后银行配置力量回归。操作更考验择券细节和交易心态。已从防守调整到积极，从短久期高杠杆转向长久期低杠杆。小仓位高频次交易无法避免，需管理好交易心态。", "date": "2025-07-04"}, {"speaker": "张帆", "text": "信用债维持看多，理财规模增加背景下资产荒未变，有正套空间。央行7月以来持续回收流动性，存单和超长债性价比降低，存单和超长债选择 var network = null;
var nodesDataset = null;
var edgesDataset = null;

console.log('Data loaded:', NODES.length, 'nodes,', EDGES.length, 'edges,', SPEAKER_PERSONAS.length, 'speakers');

function initGraph() {
  try {
    if (typeof vis === 'undefined' || !vis.Network) {
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff3e0;padding:20px;border-radius:8px;border:2px solid #e65100;text-align:center;font-size:14px;z-index:100;max-width:500px;';
      errDiv.innerHTML = '<b style="color:#e65100">vis-network.js 加载失败</b><br><span style="color:#666">请检查网络连接，或尝试 Ctrl+Shift+R 强制刷新</span>';
      document.getElementById('network').parentElement.appendChild(errDiv);
      return;
    }

    var container = document.getElementById('network');
    if (!container) throw new Error('#network not found');
    var rect = container.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) {
      setTimeout(initGraph, 100);
      return;
    }

    nodesDataset = new vis.DataSet(NODES);
    edgesDataset = new vis.DataSet(EDGES);

    network = new vis.Network(container, { nodes: nodesDataset, edges: edgesDataset }, {
      nodes: { shape: 'dot', size: 18, font: { size: 11, face: 'Microsoft YaHei, SimHei, sans-serif' }, borderWidth: 2, shadow: { enabled: true, size: 4 } },
      edges: { width: 2, smooth: { type: 'curvedCW', roundness: 0.15 }, shadow: { enabled: true, size: 2 } },
      physics: { enabled: true, solver: 'barnesHut', barnesHut: { gravitationalConstant: -6000, centralGravity: 0.3, springLength: 200, springConstant: 0.04, damping: 0.5 }, stabilization: { iterations: 200 } },
      interaction: { hover: true, tooltipDelay: 200, navigationButtons: true, keyboard: true },
    });

    network.once('stabilized', function() { network.fit({ animation: true }); });
    network.on('click', function(params) {
      if (params.nodes.length > 0) showDetail(params.nodes[0]);
      else document.getElementById('detailPanel').innerHTML = '<div class="empty">点击任意节点查看详情</div>';
    });
  } catch(e) {
    console.error('Init error:', e);
  }
}

function showDetail(nodeId) {
  var panel = document.getElementById('detailPanel');
  var fid = NODE_ID_MAP[nodeId];
  if (!fid || !RAW_DATA.nodes[fid]) { panel.innerHTML = '<div class="empty">未找到</div>'; return; }
  var n = RAW_DATA.nodes[fid];
  var html = '<div class="factor-card"><h4>' + n.label + '</h4>';
  html += '<div class="factor-meta">归属: ' + (n.primary || '-') + '</div>';
  if (n.alias && n.alias.length) html += '<div class="factor-meta">别名: ' + n.alias.join(', ') + '</div>';
  if (n.definition) html += '<div class="factor-meta" style="margin-top:4px;">' + n.definition.slice(0, 120) + '...</div>';
  html += '</div>';
  var relEdges = RAW_DATA.edges.filter(function(e) { return e.source === fid || e.target === fid; });
  if (relEdges.length > 0) {
    html += '<div style="font-size:12px;margin-top:8px;"><b>相关因果边 (' + relEdges.length + '条)</b></div>';
    relEdges.slice(0, 10).forEach(function(e) {
      var isSrc = e.source === fid;
      var other = isSrc ? e.target : e.source;
      var otherLabel = (RAW_DATA.nodes[other] || {}).label || other;
      var arrow = isSrc ? '→' : '←';
      html += '<div class="edge-item">' + arrow + ' ' + otherLabel + ' <span style="color:#888;">[' + (e.strength||'-') + ', ' + (e.sign||'+') + ']</span></div>';
    });
  }
  panel.innerHTML = html;
}

/* ===== View Modes ===== */
function setView(mode) {
  document.querySelectorAll('.toolbar-section button').forEach(function(b) { b.classList.remove('active'); });
  var btn = document.getElementById('view' + mode.charAt(0).toUpperCase() + mode.slice(1));
  if (btn) btn.classList.add('active');
  if (!edgesDataset) return;

  if (mode === 'cross') {
    var crossIds = [];
    RAW_DATA.edges.forEach(function(e, i) {
      if ((RAW_DATA.nodes[e.source] || {}).primary !== (RAW_DATA.nodes[e.target] || {}).primary) crossIds.push('e' + i);
    });
    edgesDataset.update(EDGES.map(function(e) {
      return { id: e.id, hidden: crossIds.indexOf(e.id) < 0, color: { color: crossIds.indexOf(e.id) >= 0 ? '#1a237e' : '#ccc', opacity: crossIds.indexOf(e.id) >= 0 ? 1 : 0 } };
    }));
  } else if (mode === 'strong') {
    var strongIds = [];
    RAW_DATA.edges.forEach(function(e, i) {
      if ((e.strength_score || 0) > 0.6 || e.strength === '强') strongIds.push('e' + i);
    });
    edgesDataset.update(EDGES.map(function(e) {
      var hit = strongIds.indexOf(e.id) >= 0;
      return { id: e.id, hidden: !hit, width: hit ? 4 : 1, color: { color: hit ? '#c62828' : '#ccc', opacity: hit ? 1 : 0 } };
    }));
  } else {
    edgesDataset.update(EDGES.map(function(e) { return { id: e.id, hidden: false, width: 2, color: { color: '#666', opacity: 0.7 } }; }));
  }
}

function highlightEdges(edgeIds, color) {
  edgesDataset.update(EDGES.map(function(e) {
    var hit = edgeIds.indexOf(e.id) >= 0;
    return { id: e.id, color: { color: hit ? color : '#ccc', opacity: hit ? 1 : 0.2 }, width: hit ? 4 : 1 };
  }));
}

function clearTrace() {
  document.getElementById('traceSelect').value = '';
  document.getElementById('forwardSelect').value = '';
  if (edgesDataset && network) {
    edgesDataset.update(EDGES.map(function(e) { return { id: e.id, color: { color: '#666', opacity: 0.7 }, width: 2 }; }));
    network.unselectAll();
  }
}

/* ===== 反向溯源 ===== */
function traceBack(nodeId) {
  if (!nodeId || !network) return;
  var fid = NODE_ID_MAP[nodeId];
  var targetLabel = (RAW_DATA.nodes[fid] || {}).label || fid;
  var visited = {};
  var queue = [[fid, 0, []]];
  var paths = [];

  while (queue.length > 0) {
    var curItem = queue.shift();
    var cur = curItem[0], depth = curItem[1], path = curItem[2];
    if (depth >= 3) continue;
    var inEdges = RAW_DATA.edges.filter(function(e) { return e.target === cur; });
    for (var i = 0; i < inEdges.length; i++) {
      var e = inEdges[i];
      var newPath = path.slice(); newPath.push(e);
      var src = e.source;
      var hasCycle = path.some(function(p) { return p.source === src || p.target === src; });
      if (hasCycle) continue;
      paths.push(newPath);
      if (!visited[src]) { visited[src] = true; queue.push([src, depth + 1, newPath]); }
    }
  }

  paths.sort(function(a, b) {
    return b.reduce(function(s, e) { return s + (e.support_count||0); }, 0) - a.reduce(function(s, e) { return s + (e.support_count||0); }, 0);
  });

  var relatedVisIds = [parseInt(nodeId)], relatedEdgeIds = [];
  paths.forEach(function(path) {
    path.forEach(function(e) {
      var sv = FID_TO_VISID[e.source]; if (sv && relatedVisIds.indexOf(sv) < 0) relatedVisIds.push(sv);
      RAW_DATA.edges.forEach(function(re, ri) { if (re.source === e.source && re.target === e.target && relatedEdgeIds.indexOf('e'+ri) < 0) relatedEdgeIds.push('e'+ri); });
    });
  });
  network.selectNodes(relatedVisIds); highlightEdges(relatedEdgeIds, '#c62828');

  var panel = document.getElementById('detailPanel');
  var html = '<div style="margin-bottom:8px;"><b style="font-size:15px;color:#c62828;">反向溯源: ' + targetLabel + '</b></div>';
  html += '<div style="color:#666;font-size:12px;margin-bottom:8px;">找到 ' + paths.length + ' 条前置因果路径</div>';
  if (paths.length === 0) { html += '<div class="empty">该因子没有前置原因</div>'; }
  else {
    html += '<div style="max-height:280px;overflow-y:auto;">';
    paths.slice(0, 10).forEach(function(path, pi) {
      var total = path.reduce(function(s, e) { return s + (e.support_count||0); }, 0);
      html += '<div style="margin-bottom:6px;padding:6px;background:#fff5f5;border-radius:4px;">';
      html += '<span style="font-size:11px;color:#888;">路径' + (pi+1) + ' (支撑' + total + '条)</span><br>';
      var steps = []; path.forEach(function(pe) { steps.push((pe.source_label||pe.source) + '<span style="color:#c62828;font-size:10px;">→</span>'); });
      steps.push(targetLabel);
      html += '<span style="font-size:12px;">' + steps.join('') + '</span>';
      path.forEach(function(pe) { if (pe.mechanism) html += '<div style="font-size:11px;color:#888;padding-left:10px;">' + pe.mechanism + '</div>'; });
      html += '</div>';
    });
    html += '</div>';
  }
  panel.innerHTML = html;
}

/* ===== 正向传导 ===== */
function traceForward(nodeId) {
  if (!nodeId || !network) return;
  var fid = NODE_ID_MAP[nodeId];
  var sourceLabel = (RAW_DATA.nodes[fid] || {}).label || fid;
  var visited = {};
  var queue = [[fid, 0, []]];
  var paths = [];

  while (queue.length > 0) {
    var curItem = queue.shift();
    var cur = curItem[0], depth = curItem[1], path = curItem[2];
    if (depth >= 3) continue;
    var outEdges = RAW_DATA.edges.filter(function(e) { return e.source === cur; });
    for (var i = 0; i < outEdges.length; i++) {
      var e = outEdges[i];
      var newPath = path.slice(); newPath.push(e);
      var tgt = e.target;
      var hasCycle = path.some(function(p) { return p.source === tgt || p.target === tgt; });
      if (hasCycle) continue;
      paths.push(newPath);
      if (!visited[tgt]) { visited[tgt] = true; queue.push([tgt, depth + 1, newPath]); }
    }
  }

  paths.sort(function(a, b) {
    return b.reduce(function(s, e) { return s + (e.support_count||0); }, 0) - a.reduce(function(s, e) { return s + (e.support_count||0); }, 0);
  });

  var relatedVisIds = [parseInt(nodeId)], relatedEdgeIds = [];
  paths.forEach(function(path) {
    path.forEach(function(e) {
      var tv = FID_TO_VISID[e.target]; if (tv && relatedVisIds.indexOf(tv) < 0) relatedVisIds.push(tv);
      RAW_DATA.edges.forEach(function(re, ri) { if (re.source === e.source && re.target === e.target && relatedEdgeIds.indexOf('e'+ri) < 0) relatedEdgeIds.push('e'+ri); });
    });
  });
  network.selectNodes(relatedVisIds); highlightEdges(relatedEdgeIds, '#1a237e');

  var panel = document.getElementById('detailPanel');
  var html = '<div style="margin-bottom:8px;"><b style="font-size:15px;color:#1a237e;">正向传导: ' + sourceLabel + '</b></div>';
  html += '<div style="color:#666;font-size:12px;margin-bottom:8px;">找到 ' + paths.length + ' 条下游传导路径</div>';
  if (paths.length === 0) { html += '<div class="empty">该因子没有下游传导路径</div>'; }
  else {
    html += '<div style="max-height:280px;overflow-y:auto;">';
    paths.slice(0, 10).forEach(function(path, pi) {
      var total = path.reduce(function(s, e) { return s + (e.support_count||0); }, 0);
      html += '<div style="margin-bottom:6px;padding:6px;background:#f0f4ff;border-radius:4px;">';
      html += '<span style="font-size:11px;color:#888;">路径' + (pi+1) + ' (支撑' + total + '条)</span><br>';
      var steps = [sourceLabel]; path.forEach(function(pe) { steps.push('<span style="color:#1a237e;font-size:10px;">→</span>' + (pe.target_label||pe.target)); });
      html += '<span style="font-size:12px;">' + steps.join('') + '</span>';
      path.forEach(function(pe) { if (pe.mechanism) html += '<div style="font-size:11px;color:#888;padding-left:10px;">' + pe.mechanism + '</div>'; });
      html += '</div>';
    });
    html += '</div>';
  }
  panel.innerHTML = html;
}

/* ===== 发言人视角 ===== */
function filterBySpeaker(speakerName) {
  if (!speakerName || !edgesDataset) { clearSpeaker(); return; }
  var edgeIndex = {};
  RAW_DATA.edges.forEach(function(e, i) {
    var sv = FID_TO_VISID[e.source], tv = FID_TO_VISID[e.target];
    if (sv && tv) { var key = String(sv)+'-'+String(tv); if (!edgeIndex[key]) edgeIndex[key] = []; edgeIndex[key].push('e'+i); }
  });
  var speakerEdgeIds = [];
  Object.keys(EDGE_SPEAKER_INDEX).forEach(function(edgeKey) {
    var found = (EDGE_SPEAKER_INDEX[edgeKey] || []).some(function(entry) { return entry.speaker === speakerName; });
    if (found) {
      var parts = edgeKey.split('→');
      if (parts.length === 2) {
        var key = String(FID_TO_VISID[parts[0].trim()])+'-'+String(FID_TO_VISID[parts[1].trim()]);
        if (edgeIndex[key]) edgeIndex[key].forEach(function(eid) { if (speakerEdgeIds.indexOf(eid) < 0) speakerEdgeIds.push(eid); });
      }
    }
  });

  edgesDataset.update(EDGES.map(function(e) {
    var hit = speakerEdgeIds.indexOf(e.id) >= 0;
    return { id: e.id, color: { color: hit ? '#c62828' : '#ccc', opacity: hit ? 1 : 0.3 }, width: hit ? 3 : 1 };
  }));

  var info = '<div class="persona-card"><b>' + speakerName + '</b> 涉及 <b style="color:#c62828">' + speakerEdgeIds.length + '</b> 条因果边';
  var persona = null;
  SPEAKER_PERSONAS.forEach(function(p) { if (p.speaker === speakerName) persona = p; });
  if (persona) {
    info += '<div style="margin-top:4px;color:#666;">观点: ' + persona.total_claims + ' | 偏好: ' + (persona.top_factor || '-') + ' | 倾向: ' + (persona.direction_label || '-') + '</div>';
  }
  info += '</div>';
  document.getElementById('speakerInfo').innerHTML = info;
}

function clearSpeaker() {
  document.getElementById('speakerSelect').value = '';
  document.getElementById('speakerInfo').innerHTML = '';
  if (edgesDataset) { edgesDataset.update(EDGES.map(function(e) { return { id: e.id, color: { color: '#666', opacity: 0.7 }, width: 2 }; })); }
  if (network) network.unselectAll();
}

/* ===== 筛选 ===== */
function filterByGroup(group) {
  if (!nodesDataset || !edgesDataset) return;
  if (!group) { nodesDataset.update(NODES); edgesDataset.update(EDGES.map(function(e) { return { id: e.id, hidden: false }; })); }
  else {
    var nodeIds = NODES.filter(function(n) { return n.group === group; }).map(function(n) { return n.id; });
    nodesDataset.update(NODES.filter(function(n) { return n.group === group; }));
    edgesDataset.update(EDGES.map(function(e) { return { id: e.id, hidden: !(nodeIds.indexOf(e.from) >= 0 && nodeIds.indexOf(e.to) >= 0) }; }));
  }
  if (network) network.fit({ animation: true });
}

function searchNode(keyword) {
  if (!keyword || !network) return;
  var matched = NODES.filter(function(n) { return n.label.toLowerCase().indexOf(keyword.toLowerCase()) >= 0; });
  if (matched.length > 0) { network.selectNodes(matched.map(function(n) { return n.id; })); network.focus(matched[0].id, { animation: true }); showDetail(matched[0].id); }
}

/* ===== 启动 ===== */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initGraph);
else initGraph();
</script>
